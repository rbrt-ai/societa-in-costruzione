# yaml-language-server: $schema=https://squidfunk.github.io/mkdocs-material/schema.json
site_name: Società in Costruzione
site_description: Piattaforma collaborativa per progettare, valutare e migliorare proposte pubbliche.
site_url: https://rbrt-ai.github.io/societa-in-costruzione/
repo_url: https://github.com/rbrt-ai/societa-in-costruzione
repo_name: rbrt-ai/societa-in-costruzione
edit_uri: edit/main/docs/
copyright: Società in Costruzione · Codice MIT · Licenza dei contenuti da definire

theme:
  name: material
  language: it
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Usa il tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Usa il tema chiaro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy

nav:
  - Home: index.md
  - Manifesto: manifesto.md
  - Principi: principi.md
  - Metodo: metodo.md
  - Proposte:
      - Introduzione: proposte/index.md
      - Benessere psicologico: proposte/salute-mentale-territoriale.md
      - Apprendimento permanente: proposte/apprendimento-permanente.md
      - Template: proposte/template.md
  - Partecipa: partecipa.md
  - Roadmap: roadmap.md
  - Trasparenza: trasparenza.md
  - Progetto:
      - Identità: naming.md
      - Identità social: comunicazione/identita-social.md
      - Test di comprensibilità: usability-test.md

plugins:
  - search:
      lang: it

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rbrt-ai/societa-in-costruzione
      name: Repository GitHub
    - icon: fontawesome/brands/bluesky
      link: https://bsky.app/profile/societacostruzione.bsky.social
      name: Società in Costruzione su Bluesky
    - icon: fontawesome/brands/mastodon
      link: https://mastodon.social/@societaideale
      name: Società in Costruzione su Mastodon
